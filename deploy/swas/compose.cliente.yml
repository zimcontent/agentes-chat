# Um cliente do DougBot: o servidor, o Postgres só dele (com pgvector) e uma rede só dele.
# O doug-cliente copia este arquivo para /opt/doug-clientes/<codigo>-<slug>/compose.yml e
# escreve o .env ao lado (de cliente.env.example). Não edite a cópia à mão: mude este modelo
# e rode `doug-cliente compose <codigo>`, que reinstala o compose.yml do cliente e acrescenta ao
# .env as variáveis novas.
#
# Os dados ficam em ./dados (o Postgres em dados/postgres, os arquivos em dados/files), para a
# cota de disco do cliente ser uma pasta só. A porta do servidor só abre no loopback (o doug-cliente
# e o doug-atualizar-clientes conferem o /api/health por ela); quem publica o cliente é o proxy,
# com TLS: o Caddy de deploy/swas/caddy (por essa porta) ou o proxy que já existe na máquina (pela
# rede do cliente, pelo nome do contêiner: README, "O proxy").
name: "doug-${DOUG_CLIENT_CODE:?defina DOUG_CLIENT_CODE no .env}"

services:
  postgres:
    # pgvector: a primeira migração cria a extensão vector.
    image: pgvector/pgvector:0.8.7-pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    environment:
      POSTGRES_USER: agentes
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}"
      POSTGRES_DB: agentes
    volumes:
      # As imagens do Postgres 18 guardam os dados em /var/lib/postgresql/18/docker, sob este ponto.
      - ./dados/postgres:/var/lib/postgresql
    networks: [cliente]
    restart: unless-stopped
    healthcheck:
      # Por TCP: no primeiro boot o servidor de inicialização escuta só no socket Unix.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U agentes -d agentes"]
      interval: 5s
      timeout: 5s
      retries: 10
    cpus: "${DOUG_PG_CPUS:-1}"
    mem_limit: "${DOUG_PG_MEMORY:-1g}"
    memswap_limit: "${DOUG_PG_MEMORY:-1g}"
    stop_grace_period: 30s
    logging: &logs
      # Sem teto, o log do contêiner cresce até encher o disco da máquina, de todos os clientes.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  agentes:
    image: "${DOUG_IMAGE:?defina DOUG_IMAGE no .env}"
    env_file: .env
    # Um uid por cliente (100000 + o código, no .env): o dono de dados/files de um cliente não é
    # o de outro cliente nem o de um login da máquina. A imagem roda com um uid qualquer: o /app é
    # do root e legível por todos, e o servidor só escreve em /tmp e em FILES_DIR.
    user: "${DOUG_UID:?defina DOUG_UID no .env}:${DOUG_UID}"
    environment:
      DATABASE_URL: "postgres://agentes:${POSTGRES_PASSWORD}@postgres:5432/agentes"
      FILES_DIR: /data/files
      # Um uid sem entrada em /etc/passwd não tem HOME.
      HOME: /tmp
    volumes:
      # Do uid DOUG_UID: o doug-cliente ajusta ao criar.
      - ./dados/files:/data/files
    ports:
      # Só no loopback: o Docker publica portas pelo iptables, por cima de qualquer firewall do host.
      - "127.0.0.1:${DOUG_HOST_PORT:?defina DOUG_HOST_PORT no .env}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [cliente]
    restart: unless-stopped
    # Acima do limite, o kernel para só este contêiner e ele reinicia, em vez de a máquina
    # entrar em swap e derrubar os outros clientes.
    cpus: "${DOUG_CPUS:-2}"
    mem_limit: "${DOUG_MEMORY:-3g}"
    memswap_limit: "${DOUG_MEMORY:-3g}"
    # Acima dos 20 s que as execuções em andamento têm para terminar no SIGTERM (RUN_DRAIN_MS).
    stop_grace_period: 40s
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging: *logs

networks:
  # A rede é só deste cliente: nenhum outro cliente enxerga o Postgres dele. A sub-rede é fixa,
  # 10.64.<código>.0/24 (DOUG_REDE no .env): o servidor só confia no proxy dessa faixa
  # (TRUSTED_PROXIES), e o proxy que já existe na máquina entra nela com o endereço .2 (o
  # doug-cliente o liga). Os contêineres do cliente pegam endereços de .128 para cima.
  cliente:
    name: "doug-${DOUG_CLIENT_CODE}"
    ipam:
      config:
        - subnet: "${DOUG_REDE:?defina DOUG_REDE no .env}.0/24"
          ip_range: "${DOUG_REDE}.128/25"
