<style>

body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:48px 20px;background:radial-gradient(60% 45% at 50% 42%,color-mix(in srgb,var(--db-verde-acento) 10%,transparent),transparent 70%),var(--db-palco);color:var(--db-texto);font:15px/1.5 var(--font-sans);-webkit-font-smoothing:antialiased}

<script>
// Before the first paint, as index.html does. Mirrors the app's choices: STORAGE_KEYS.theme
// (apps/web/src/lib/storage.ts), savedLocale (apps/web/src/i18n/index.ts) and appLocale
// (packages/i18n/src/locale.ts), plus the landing's agentes_locale cookie. index.html's boot box picks the same way, from the same 14 languages.
(() => {
  const html = document.documentElement;
  const saved = (key) => {
    try {
      return localStorage.getItem(key);
    } catch {
      return null;
    }
  };
  try {
    let theme = saved("agentes.theme");
    if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    html.dataset.theme = theme;
  } catch {}
  const CODES = ["en", "pt-BR", "es", "fr", "de", "it", "nl", "ja", "ko", "zh-Hans", "id", "tr", "pl", "ru"];
  const known = (tag) => {
    const base = String(tag || "").toLowerCase().replace(/_/g, "-").split("-")[0];
    const code = base === "pt" ? "pt-BR" : base === "zh" ? "zh-Hans" : base === "in" ? "id" : base;
    return CODES.includes(code) ? code : null;
  };
  const lang = () => {
    const stored = saved("agentes.locale");
    if (stored && stored !== "auto" && known(stored)) return known(stored);
    const cookie = /(?:^|;\s*)agentes_locale=([\w-]+)/.exec(document.cookie);
    if (stored !== "auto" && cookie && known(cookie[1])) return known(cookie[1]);
    const tags = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
    for (const tag of tags) if (known(tag)) return known(tag);
    return "en";
  };
  html.lang = lang();
  const app = window.__agentesDesktop;
  if (app) html.dataset.desktop = app.platform === "windows" || app.platform === "linux" ? app.platform : "mac";
})();
</script>

<h1><span id="title">DougBot will be right back</span></h1>
<p id="text">The server isn't answering right now. This page opens by itself as soon as it's back.</p>
<p id="paid" hidden>If you just paid, there's no need to pay again.</p>
<a id="retry" class="btn" href="">Try now</a>
</main>
<div class="strip" data-tauri-drag-region="deep" aria-hidden="true"></div>
<script>
// Until the server answers again, this page asks for the address it stands in for, and loads it as soon as the
// answer isn't a proxy's error (Caddy's 502 to 504, Cloudflare's 52x). One question at a time: the proxy may hold it
// while the server restarts. location.replace is a GET without the hash, so a form is never sent again. An address
// under /api/ may be a sign-in's one-time return: the server's health stands in for it, so only the load runs it. A
// redirect is the server's answer, never followed (to the apps' links or another site, fetch would fail).
(() => {
  // title, text, paid, retry. The markup is the English.
  const WORDS = {
    "pt-BR": ["O DougBot já volta", "O servidor não está respondendo agora. Esta página abre sozinha assim que ele voltar.", "Se você acabou de pagar, não precisa pagar de novo.", "Tentar agora"],
    es: ["DougBot vuelve enseguida", "El servidor no responde ahora. Esta página se abre sola en cuanto vuelva.", "Si acabas de pagar, no hace falta pagar de nuevo.", "Intentar ahora"],
    fr: ["DougBot revient tout de suite", "Le serveur ne répond pas pour le moment. Cette page s'ouvre d'elle-même dès qu'il revient.", "Si vous venez de payer, inutile de payer à nouveau.", "Réessayer"],
    de: ["DougBot ist gleich wieder da", "Der Server antwortet gerade nicht. Diese Seite öffnet sich von selbst, sobald er wieder da ist.", "Wenn du gerade bezahlt hast, musst du nicht noch einmal bezahlen.", "Jetzt versuchen"],
    it: ["DougBot torna subito", "Il server non risponde in questo momento. Questa pagina si apre da sola appena torna.", "Se hai appena pagato, non serve pagare di nuovo.", "Riprova ora"],
    nl: ["DougBot is zo terug", "De server reageert nu niet. Deze pagina opent vanzelf zodra hij terug is.", "Heb je net betaald? Dan hoef je niet opnieuw te betalen.", "Nu proberen"],
    ja: ["DougBot はまもなく戻ります", "サーバーが現在応答していません。復旧するとこのページは自動で開きます。", "お支払いが済んでいれば、もう一度支払う必要はありません。", "今すぐ試す"],
    ko: ["DougBot이 곧 돌아와요", "지금 서버가 응답하지 않아요. 서버가 돌아오면 이 페이지가 자동으로 열려요.", "방금 결제했다면 다시 결제할 필요 없어요.", "지금 시도"],
    "zh-Hans": ["DougBot 马上回来", "服务器暂时没有响应。服务器恢复后，此页面会自动打开。", "如果你刚刚付过款，无需再次付款。", "立即重试"],
    id: ["DougBot segera kembali", "Server sedang tidak merespons. Halaman ini akan terbuka sendiri begitu server kembali.", "Kalau kamu baru saja membayar, tidak perlu membayar lagi.", "Coba sekarang"],
    tr: ["DougBot birazdan geri dönecek", "Sunucu şu anda yanıt vermiyor. Bu sayfa, sunucu geri döner dönmez kendiliğinden açılır.", "Ödemeyi az önce yaptıysanız tekrar ödemenize gerek yok.", "Şimdi dene"],
    pl: ["DougBot zaraz wróci", "Serwer teraz nie odpowiada. Ta strona otworzy się sama, gdy tylko wróci.", "Jeśli płatność właśnie została zrealizowana, nie trzeba płacić ponownie.", "Spróbuj teraz"],
    ru: ["DougBot скоро вернётся", "Сервер сейчас не отвечает. Эта страница откроется сама, как только он вернётся.", "Если вы только что оплатили, платить ещё раз не нужно.", "Попробовать сейчас"],
  };
  const MISS = [502, 503, 504, 520, 521, 522, 523, 524, 525, 526, 527, 530];
  const byId = (id) => document.getElementById(id);
  const words = WORDS[document.documentElement.lang];
  if (words) {
    document.title = words[0];
    ["title", "text", "paid", "retry"].forEach((id, i) => {
      byId(id).textContent = words[i];
    });
  }
  if (location.pathname === "/done") byId("paid").hidden = false;
  const target = location.pathname === "/unavailable.html" ? "/" : location.pathname + location.search;
  const probe = target.startsWith("/api/") ? "/api/health" : target;
  const retry = byId("retry");
  retry.href = target;
  retry.addEventListener("click", (event) => {
    event.preventDefault();
    location.replace(target);
  });
  let wait = 3000;
  let timer = 0;
  let asking = false;
  const later = () => {
    asking = false;
    clearTimeout(timer);
    timer = setTimeout(ask, wait);
    wait = Math.min(wait * 1.5, 30000);
  };
  function ask() {
    clearTimeout(timer);
    if (asking || document.visibilityState === "hidden") return;
    asking = true;
    fetch(probe, { cache: "no-store", credentials: "same-origin", redirect: "manual" }).then(
      (res) => (MISS.includes(res.status) ? later() : location.replace(target)),
      later,
    );
  }
  document.addEventListener("visibilitychange", ask);
  addEventListener("online", ask);
  later();
  // In the desktop app's window: the app's cover lifts once this page is on the glass (pageReady in
  // apps/web/src/lib/desktop.ts).
  const tauri = window.__TAURI_INTERNALS__;
  if (window.__agentesDesktop && tauri && typeof tauri.invoke === "function") {
    requestAnimationFrame(() => requestAnimationFrame(() => Promise.resolve(tauri.invoke("page_ready", {})).catch(() => {})));
  }
})();
</script>
