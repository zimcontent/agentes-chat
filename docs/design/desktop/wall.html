<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desktop wallpaper</title>
<!-- The agents' desktop wallpaper (1280×900), drawn by out/wall.js: render.sh screenshots this page. -->
<style>
@font-face {
  font-family: "Manrope";
  font-weight: 200 800;
  src: url("out/manrope.woff2") format("woff2");
}
html, body { margin: 0; overflow: hidden; background: #000; }
/* The stage (the identity's --db-palco): nearly all of the screen, where the windows sit. */
.wall { position: relative; width: 1280px; height: 900px; overflow: hidden; background: #0a0a0a; }
/* The team in a row, standing behind the counter: each bot lights the floor in its own color. */
.team { position: absolute; left: 0; right: 0; display: flex; justify-content: center; align-items: flex-end; }
.team span { flex: none; line-height: 0; }
.team svg { display: block; width: 100%; height: 100%; overflow: visible; }
/* The counter: the identity's frosted glass with bots behind it, so their colors come through (--db-vidro-leve,
   --db-desfoque, --db-vidro-borda, --db-vidro-brilho). */
.counter {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(18, 18, 18, 0.58);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  backdrop-filter: blur(20px) saturate(140%);
  border-top: 1px solid rgba(255, 255, 255, 0.086);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
}
/* The signature as the identity builds it (§3), on the dark stage: the Doug and the name in #EDEDED. */
.assina {
  position: absolute;
  transform: translateY(-50%);
  display: inline-flex;
  align-items: center;
  gap: 0.36em;
  font: 500 var(--t) / 1 "Manrope";
  letter-spacing: -0.035em;
  white-space: nowrap;
  color: #ededed;
}
.assina b { font-weight: 800; }
.assina .av { display: inline-block; width: calc(var(--t) * 1.42); height: calc(var(--t) * 1.42); flex: none; line-height: 0; }
.assina .av svg { display: block; width: 100%; height: 100%; overflow: visible; }
</style>
</head>
<body>
<div class="wall"></div>
<script src="out/wall.js"></script>
</body>
</html>
