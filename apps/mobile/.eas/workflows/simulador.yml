# Before a build goes to TestFlight: the app built for the iPhone simulator, opened on it and watched for a while
# (Maestro, `.maestro/abre.yaml`). Runs by hand: `eas workflow:run .eas/workflows/simulador.yml`.
name: Simulador

jobs:
  build_ios_simulator:
    name: Build para o simulador
    type: build
    params:
      platform: ios
      profile: simulator
  abre:
    name: Abre e fica aberto
    needs: [build_ios_simulator]
    type: maestro
    params:
      build_id: ${{ needs.build_ios_simulator.outputs.build_id }}
      flow_path: ['.maestro/abre.yaml']
